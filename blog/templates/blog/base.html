{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Django Girls blog</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lobster&subset=latin,latin-ext">
        <link rel="stylesheet" href="{% static 'css/blog.css' %}">
    </head>
    <body>
        <header class="page-header">
            <div class="container d-flex justify-content-between align-items-center">
                <h1><a href="/">Django Girls Blog</a></h1>

               <div>
                    {% if user.is_authenticated %}
                        <span class="me-3">Здраво, <b>{{ user.username }}</b>!</span> 
                        
                        <a href="{% url 'post_new' %}" class="btn btn-outline-dark me-2">Пријави Скемер +</a>
                        
                        <form method="post" action="{% url 'logout' %}" class="d-inline">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-danger">Одјави се</button>
                        </form>

                    {% else %}
                        <a href="{% url 'login' %}" class="btn btn-success me-2">Најави се</a>
                        <a href="{% url 'register' %}" class="btn btn-primary">Регистрирај се</a>
                    {% endif %}
                </div>
            </div>
        </header>

        <main class="container">
            <div class="row">
                <div class="col-md-12">
                    {% block content %}
                    {% endblock %}
                </div>
            </div>
        </main>
    </body>
</html>
